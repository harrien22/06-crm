[workspace]
members = ["crm", "crm-metadata", "crm-send", "user-stat"]
resolver = "2"


[workspace.dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.40", features = ["serde"] }
crm-metadata = { path = "crm-metadata" }
crm-send = { path = "crm-send" }
derive_builder = "0.20.2"
futures = "0.3.31"
itertools = "0.14.0"
prost = "0.13.5"
prost-build = "0.13.5"
prost-types = "0.13.5"
proto-builder-trait = "0.6.2"
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
sqlx = { version = "0.8.5", features = [
    "chrono",
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
tokio = { version = "1.44.2", features = ["rt", "rt-multi-thread", "macros"] }
tokio-stream = "0.1.17"
tonic = { version = "0.13.0", features = ["zstd", "tls-ring"] }
tonic-build = "0.13.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
user-stat = { path = "user-stat" }
